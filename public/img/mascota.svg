<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fondo transparente / Lienzo de la Mascota -->
  <g id="mascota" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Oreja Izquierda -->
    <path d="M 60 70 L 40 30 L 80 50 Z" fill="#FF9A00" stroke="#333333" stroke-width="4"/>
    <!-- Oreja Derecha -->
    <path d="M 140 70 L 160 30 L 120 50 Z" fill="#FF9A00" stroke="#333333" stroke-width="4"/>
    <!-- Cabeza / Cara Principal -->
    <circle cx="100" cy="100" r="50" fill="#FFB74D" stroke="#333333" stroke-width="4"/>
    <!-- Ojo Izquierdo -->
    <circle cx="85" cy="95" r="6" fill="#333333"/>
    <!-- Ojo Derecha -->
    <circle cx="115" cy="95" r="6" fill="#333333"/>
    <!-- Nariz -->
    <polygon points="100,105 94,111 106,111" fill="#E57373" stroke="#333333" stroke-width="2"/>
    <!-- Boca / Sonrisa -->
    <path d="M 94 116 Q 100 122 106 116" stroke="#333333" stroke-width="3"/>
    <!-- Mejas / Rubor -->
    <circle cx="75" cy="108" r="5" fill="#FF8A80" opacity="0.6"/>
    <circle cx="125" cy="108" r="5" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>